<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePi App</title>
    <style>
body {
  font-family: sans-serif;
  padding: 50px;
  text-align: center;
  background-color: #121212;
  color: white;
  transition: all 0.4s ease;
  background-color: #121212;
}
input {
  padding: 12px 18px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #444;
  margin: 10px;
  background: #222;
  color: #fff;
  outline: none;
}
#title {
  color: #00d2ff;
}
#greetBtn {
  color: #2ed573;
}
.cp-btn {
  padding: 14px 28px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>
<body>
  <h1 id="title">Welcome to CodePi Forms</h1>
  <div><input type="text" id="userName" placeholder="Type your name here..."></div>
  <button id="greetBtn" class="cp-btn">Greeting Me</button>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const targetBtn = document.getElementById("greetBtn");
  if(targetBtn) {
    targetBtn.addEventListener("click", () => {
      const val = document.getElementById("userName").value; alert(val ? "Hello, " + val : "Please type something!");
    });
  }
});
</script>
</body>
</html>
