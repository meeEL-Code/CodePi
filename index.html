<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePi App</title>
    <style>
body {
  font-family: sans-serif;
  padding: 50px;
  text-align: center;
  transition: all 0.4s ease;
  background-color: #181818;
}
#title {
  color: #00d2ff;
}
#myBtn {
  color: #ff4757;
}
.cp-btn {
  padding: 14px 28px;
  font-size: 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>
<body>
  <h1 id="title">CodePi Live Interactive App</h1>
  <button id="myBtn" class="cp-btn">Click Me to Change Theme</button>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const targetBtn = document.getElementById("myBtn");
  if(targetBtn) {
    targetBtn.addEventListener("click", () => {
      document.body.style.backgroundColor = "#2ed573";
    alert("Awesome! Theme changed successfully.");
    });
  }
});
</script>
</body>
</html>
