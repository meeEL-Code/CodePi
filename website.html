<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePi - Official Web IDE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f13; color: white; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e1e2e; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #313244; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: bold; color: #89b4fa; }
        .logo-area svg { width: 28px; height: 28px; fill: #89b4fa; }
        .status-badge { display: flex; align-items: center; gap: 6px; background-color: #313244; padding: 6px 12px; border-radius: 20px; font-size: 12px; color: #a6e3a1; font-weight: bold; }
        .status-dot { width: 8px; height: 8px; background-color: #a6e3a1; border-radius: 50%; box-shadow: 0 0 8px #a6e3a1; animate: pulse 2s infinite; }
        
        .tabs { display: flex; background: #181825; padding: 10px 20px 0; gap: 5px; }
        .tab-btn { padding: 10px 20px; background: #313244; color: #a6adc8; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #1e1e2e; color: #89b4fa; border-bottom: 2px solid #89b4fa; }
        
        .workspace { flex: 1; display: flex; position: relative; }
        .pane { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; }
        .pane.active { display: flex; }
        
        textarea { width: 100%; height: 100%; background: #1e1e2e; color: #cdd6f4; border: none; padding: 20px; font-family: 'Courier New', Courier, monospace; font-size: 15px; outline: none; resize: none; line-height: 1.5; }
        iframe { width: 100%; height: 100%; background: #0f0f13; border: none; }

        @media (min-width: 768px) {
            .tabs { display: none; }
            .workspace { flex-direction: row; }
            .pane { position: relative; display: flex; width: 50%; border-right: 2px solid #313244; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <!-- Code SVG Icon -->
            <svg viewBox="0 0 24 24"><path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0l4.6-4.6-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/></svg>
            <span>CodePi IDE</span>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Auto-Preview Active</span>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" id="tab-editor" onclick="switchTab('editor')">Editor</button>
        <button class="tab-btn" id="tab-preview" onclick="switchTab('preview')">Preview</button>
    </div>

    <div class="workspace">
        <div class="pane active" id="pane-editor">
            <textarea id="code-input" spellcheck="false" placeholder="Type your CodePi code here..." oninput="compileCode()">make background color #0f0f13

create image from "https://picsum.photos/400/200?random=8" with name "img"
animate "img" with "fade-in"

create heading "Welcome to CodePi" with name "title"
make "title" color #a6e3a1
animate "title" with "slide-up"

create text "Type code in editor and watch instant magic!" with name "desc"

create input "Type your name..." with name "userInput"
create button "Test Me" with name "btn"
make "btn" background #89b4fa

when "btn" is clicked:
    say text from "userInput"
</textarea>
        </div>
        <div class="pane" id="pane-preview">
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('tab-editor').classList.remove('active');
            document.getElementById('tab-preview').classList.remove('active');
            document.getElementById('pane-editor').classList.remove('active');
            document.getElementById('pane-preview').classList.remove('active');

            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('pane-' + tab).classList.add('active');
        }

        async function compileCode() {
            const code = document.getElementById('code-input').value;
            try {
                const response = await fetch('/compile', {
                    method: 'POST',
                    body: code
                });
                const html = await response.text();
                const iframe = document.getElementById('preview-frame');
                iframe.srcdoc = html;
            } catch (error) {
                console.error("Compilation error", error);
            }
        }
        
        // Initial compile on load
        compileCode();
    </script>

</body>
</html>
